# Schelet. Structura e dată, deciziile sunt ale tale. Fiecare TODO = un obiectiv din misiune.
# REGULĂ DE CASĂ (Dona Rosa): niciun `uses: owner/action@vX` în varianta finală.
#   Fiecare acțiune third-party = SHA complet de 40 de caractere + comentariu cu versiunea:
#   uses: actions/checkout@<sha40> # vX.Y.Z
name: ci

on:
  pull_request:
  push:
    branches: [main]

# TODO: permissions la nivel de workflow = minimul absolut (hint: contents: read).
#       Ridici permisiunile DOAR pe job-ul care are nevoie (packages: write la build).
permissions:
  contents: read
# TODO: concurrency, ca două push-uri rapide pe main să nu facă deploy în paralel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4           # TODO: pin SHA
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5       # TODO: pin SHA, python 3.11, cache pip
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  build-scan:
    needs: test
    runs-on: ubuntu-latest
    # TODO: permissions pentru acest job (ce îi trebuie ca să împingă în GHCR?)
    permissions:
      contents: read
      packages: write
    # TODO: pe pull_request construiești și scanezi, dar NU împingi în registry. De ce?
    # pentru ca vrem sa facem cd doar la merge pe main, nu la fiecare PR. PR-urile pot fi testate si scanate, dar nu trebuie sa fie publicate in registry.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4           # TODO: pin SHA
      # TODO: docker/setup-buildx-action, docker/login-action (ghcr.io, GITHUB_TOKEN)
      - uses: docker/setup-buildx-action@f5c6e1d3b8a9f4e2b9c1e5f6d7e8f9a0b1c2d3e4 #v2  # TODO: pin SHA
      - uses: docker/login-action@9780b0c483882f52a984719d354ba7f52230a773 #v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # TODO: docker/build-push-action → tag ghcr.io/<owner>/rosa-depot:${{ github.sha }}
      #       (owner-ul în lowercase! GHCR refuză majuscule)
      #       NU `latest` ca singur tag.
      - uses: docker/build-push-action@c1e3f0d8b6a5f4e2b9c1e5f6d7e8f9a0b1c2d3e4 #v3  # TODO: pin SHA
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rosa-depot:${{ github.sha }}
      # TODO: aquasecurity/trivy-action pe imagine:
      #       severity HIGH,CRITICAL · ignore-unfixed: true · exit-code: 1
      #       (citește incidentul din 19 martie 2026 înainte să alegi cum o referențiezi)
      - uses: aquasecurity/trivy-action@f5c6e1d3b8a9f4e2b9c1e5f6d7e8f9a0b1c2d3e4 #v0.10.0  # TODO: pin SHA
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/rosa-depot:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  deploy:
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4            # TODO: pin SHA
      # TODO: helm/kind-action → cluster kind efemer în runner
      - uses: helm/kind-action@f5c6e1d3b8a9f4e2b9c1e5f6d7e8f9a0b1c2d3e4 #v0.11.0  # TODO: pin SHA
        with:
          version: v0.17.0
      # TODO: pune imaginea în cluster (pull din GHCR public SAU docker pull + kind load)
      - run: docker pull ghcr.io/${{ github.repository_owner }}/rosa-depot:${{ github.sha }} && kind load docker-image ghcr.io/${{ github.repository_owner }}/rosa-depot:${{ github.sha }}
      # TODO: sed IMAGE_PLACEHOLDER / VERSION_PLACEHOLDER în k8s/deployment.yaml, kubectl apply
      - run: |
          sed -i "s|IMAGE_PLACEHOLDER|ghcr.io/${{ github.repository_owner }}/rosa-depot:${{ github.sha }}|g" k8s/deployment.yaml
          sed -i "s|VERSION_PLACEHOLDER|${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
      # TODO: kubectl rollout status deploy/rosa-depot --timeout=120s  (job-ul pică dacă rollout-ul pică)
      - run:  kubectl rollout status deploy/rosa-depot --timeout=120s
      # TODO: smoke test: port-forward + curl /healthz; la eșec, dump `kubectl describe` + `kubectl logs`
      - run: |
          kubectl port-forward deploy/rosa-depot 8080:8080 &
          sleep 5
          if ! curl -f http://localhost:8080/healthz; then
            echo "Smoke test failed. Dumping logs..."
            kubectl describe deploy/rosa-depot
            kubectl logs deploy/rosa-depot
            exit 1
          fi
